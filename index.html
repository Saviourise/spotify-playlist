<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Eseosa GNF - editorial and curated Spotify gospel playlists, sorted by genre."
    />
    <link rel="icon" type="image/jpeg" href="/eseosa-icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Eseosa GNF - Curated Spotify Gospel Playlists</title>
  </head>
  <body>
    <!-- Hidden form so Netlify detects the track submission form at build time.
         The real submission is POSTed from the React form on /submit. -->
    <form name="track-submission" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="track-submission" />
      <input name="bot-field" />
      <input type="text" name="artist" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="trackTitle" />
      <input type="url" name="spotifyUrl" />
      <input type="text" name="genre" />
      <textarea name="placements"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
